name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      # Fase 8: contoh Axum (`examples/08_axum_api`) & test HTTP-nya
      # (`tests/integration_axum.rs`) butuh fitur `serde` untuk compile
      # sama sekali (`required-features = ["serde"]` di Cargo.toml) --
      # tanpa dua step ini, keduanya tidak pernah benar-benar dicek CI.
      - name: cargo clippy (serde)
        run: cargo clippy --all-targets --features serde -- -D warnings

      - name: cargo test (serde)
        run: cargo test --all-targets --features serde
